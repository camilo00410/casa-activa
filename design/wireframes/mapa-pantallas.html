<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Casa Activa · Mapa de pantallas</title>
<style>
  body { margin: 0; background: #fff; }
  svg { display: block; font-family: Arial, Helvetica, sans-serif; }
  .zona { fill: #f6f6f6; stroke: #777; stroke-width: 2; stroke-dasharray: 8 6; }
  .zt { font-size: 17px; font-weight: 700; fill: #333; }
  .nodo { fill: #fff; stroke: #333; stroke-width: 2; }
  .nt { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
  .ns { font-size: 13px; fill: #555; text-anchor: middle; }
  .a { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#f); }
  .ida { marker-start: url(#f); }
  .d { stroke-dasharray: 6 5; }
  .et { font-size: 13px; fill: #333; paint-order: stroke; stroke: #f6f6f6; stroke-width: 4px; }
</style>
</head>
<body>

  <path class="a d" d="M515 422V588"/>
  <text class="et" x="330" y="500">solo con rol administrador</text>
  <text class="et" x="970" y="622">Lo publicado aparece</text>
  <text class="et" x="970" y="640">en W5, W6 y W7</text>

</body>
</html>
